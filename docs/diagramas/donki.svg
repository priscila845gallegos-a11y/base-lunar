<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Cómo se obtiene el dato del Nivel 4</title>
  <desc id="desc">Al abrir el juego, si hay una caché de menos de 6 horas y válida, se usa como dato en vivo. Si no, se consulta api.nasa.gov con un máximo de 3 segundos; si falla, el CCMC con otros 3 segundos. Si responde cualquiera, el dato es EN VIVO con la hora de la consulta. Si las dos fallan, o con la opción offline, se usa el respaldo histórico: la llamarada X8.7 del 14-05-2024, con la etiqueta HISTÓRICO REAL.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #0F172A; }
    .caja { font-size: 14px; font-weight: 600; }
    .nota { font-size: 12.5px; fill: #334155; }
    .flecha { stroke: #334155; stroke-width: 1.6; fill: none; }
  </style>
  <rect width="900" height="520" fill="#FFFFFF"/>

  <!-- Abrir el juego -->
  <rect x="350" y="20" width="200" height="44" rx="22" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text class="caja" x="450" y="47" text-anchor="middle">Abrir el juego</text>

  <!-- ¿Caché? -->
  <path d="M450,92 L610,140 L450,188 L290,140 Z" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text class="caja" x="450" y="136" text-anchor="middle">¿Caché de menos de 6 h</text>
  <text class="caja" x="450" y="154" text-anchor="middle">y válida?</text>
  <path class="flecha" d="M450,64 V90" marker-end="url(#flecha)"/>

  <!-- api.nasa.gov y CCMC -->
  <rect x="330" y="230" width="240" height="46" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text class="caja" x="450" y="258" text-anchor="middle">api.nasa.gov · 3 s como máximo</text>
  <rect x="330" y="330" width="240" height="46" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text class="caja" x="450" y="358" text-anchor="middle">CCMC · 3 s como máximo</text>
  <path class="flecha" d="M450,188 V228" marker-end="url(#flecha)"/>
  <text class="nota" x="460" y="212">no</text>
  <path class="flecha" d="M450,276 V328" marker-end="url(#flecha)"/>
  <text class="nota" x="460" y="306">falla</text>

  <!-- EN VIVO -->
  <rect x="670" y="226" width="210" height="74" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text class="caja" x="775" y="256" text-anchor="middle">Dato EN VIVO</text>
  <text class="nota" x="775" y="278" text-anchor="middle">con la hora de la consulta</text>
  <path class="flecha" d="M610,140 H775 V224" marker-end="url(#flecha)"/>
  <text class="nota" x="690" y="132">sí</text>
  <path class="flecha" d="M570,253 H668" marker-end="url(#flecha)"/>
  <text class="nota" x="619" y="245" text-anchor="middle">responde</text>
  <path class="flecha" d="M570,353 H740 V302" marker-end="url(#flecha)"/>
  <text class="nota" x="655" y="345" text-anchor="middle">responde</text>

  <!-- Respaldo histórico -->
  <rect x="230" y="430" width="440" height="62" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
  <text class="caja" x="450" y="456" text-anchor="middle">Respaldo histórico: llamarada X8.7 del 14-05-2024</text>
  <text class="nota" x="450" y="478" text-anchor="middle">etiqueta «HISTÓRICO REAL»</text>
  <path class="flecha" d="M450,376 V428" marker-end="url(#flecha)"/>
  <text class="nota" x="460" y="406">falla</text>

  <!-- Opción offline -->
  <path class="flecha" d="M350,42 H110 V461 H228" marker-end="url(#flecha)"/>
  <text class="nota" x="120" y="250">opción</text>
  <text class="nota" x="120" y="266">--offline</text>
</svg>
