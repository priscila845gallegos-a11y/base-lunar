<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitectura de Base Lunar</title>
  <desc id="desc">La web encadena config, levels, nasaData, game y ui, que dibuja index.html. El escritorio tiene la aplicación WPF, que usa el núcleo; el núcleo consulta NASA DONKI. Las pruebas de paridad comprueban que el núcleo y la web tienen los mismos textos, cifras y reglas.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="flechaParidad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #0F172A; }
    .grupo { font-size: 15px; font-weight: 700; }
    .caja { font-size: 14px; font-weight: 600; }
    .nota { font-size: 12px; fill: #475569; }
    .flecha { stroke: #334155; stroke-width: 1.6; fill: none; }
    .paridad { stroke: #7C3AED; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
  </style>
  <rect width="900" height="420" fill="#FFFFFF"/>

  <!-- Web -->
  <rect x="20" y="20" width="360" height="380" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text class="grupo" x="40" y="46">Web (raíz del repositorio)</text>
  <g>
    <rect x="110" y="66" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="caja" x="200" y="88" text-anchor="middle">js/config.js</text>
    <rect x="110" y="122" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="caja" x="200" y="144" text-anchor="middle">js/levels.js</text>
    <rect x="110" y="178" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="caja" x="200" y="200" text-anchor="middle">js/nasaData.js</text>
    <rect x="110" y="234" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="caja" x="200" y="256" text-anchor="middle">js/game.js</text>
    <rect x="110" y="290" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="caja" x="200" y="312" text-anchor="middle">js/ui.js</text>
    <rect x="90" y="346" width="220" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB"/>
    <text class="caja" x="200" y="368" text-anchor="middle">index.html + style.css</text>
    <path class="flecha" d="M200,100 V120" marker-end="url(#flecha)"/>
    <path class="flecha" d="M200,156 V176" marker-end="url(#flecha)"/>
    <path class="flecha" d="M200,212 V232" marker-end="url(#flecha)"/>
    <path class="flecha" d="M200,268 V288" marker-end="url(#flecha)"/>
    <path class="flecha" d="M200,324 V344" marker-end="url(#flecha)"/>
  </g>

  <!-- Escritorio -->
  <rect x="520" y="20" width="360" height="250" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="grupo" x="540" y="46">Escritorio (C# + WPF)</text>
  <rect x="550" y="64" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#7C3AED"/>
  <text class="caja" x="700" y="90" text-anchor="middle">BaseLunar.App (interfaz)</text>
  <text class="nota" x="700" y="110" text-anchor="middle">JuegoVM · Vistas · Animación · Audio</text>
  <rect x="550" y="186" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#7C3AED"/>
  <text class="caja" x="700" y="212" text-anchor="middle">BaseLunar.Nucleo (reglas)</text>
  <text class="nota" x="700" y="232" text-anchor="middle">Configuracion · Guion · Motor · Donki</text>
  <path class="flecha" d="M700,126 V184" marker-end="url(#flecha)"/>
  <text class="nota" x="710" y="160">usa</text>

  <!-- NASA DONKI -->
  <rect x="580" y="326" width="240" height="60" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text class="caja" x="700" y="351" text-anchor="middle">NASA DONKI</text>
  <text class="nota" x="700" y="371" text-anchor="middle">api.nasa.gov · CCMC</text>
  <path class="flecha" d="M700,248 V324" marker-end="url(#flecha)"/>
  <text class="nota" x="710" y="292">HTTPS GET (solo escritorio)</text>

  <!-- Paridad -->
  <path class="paridad" d="M290,139 C410,139 430,205 548,210" marker-end="url(#flechaParidad)"/>
  <path class="paridad" d="M290,251 C410,251 430,222 548,222" marker-end="url(#flechaParidad)"/>
  <text class="nota" x="450" y="284" text-anchor="middle" style="fill:#6D28D9">pruebas de paridad:</text>
  <text class="nota" x="450" y="300" text-anchor="middle" style="fill:#6D28D9">mismos textos, cifras</text>
  <text class="nota" x="450" y="316" text-anchor="middle" style="fill:#6D28D9">y reglas</text>
</svg>
